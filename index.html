<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALPS Pure Essence — Dược mỹ phẩm tế bào gốc sông băng Thụy Sĩ</title>
<meta name="description" content="Thương hiệu dược mỹ phẩm thuần chay tế bào gốc sông băng Thụy Sĩ Alps Pure Essence.">
<meta name="theme-color" content="#05090c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Be+Vietnam+Pro:wght@300;400;500&amp;display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#05090c}
a{color:#eef3f4}a:hover{color:#e6d6ba}
*{box-sizing:border-box}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.wrap{max-width:1240px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px)}
.sec{padding-top:clamp(96px,12vw,170px);padding-bottom:clamp(96px,12vw,170px)}
.eb{display:flex;align-items:center;gap:14px;margin:0 0 26px;font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#d8c3a0}
.eb::before{content:'';width:28px;height:1px;background:currentColor;opacity:.7}
.h2{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(42px,5.2vw,80px);line-height:1.02;letter-spacing:-.01em}
.lead{margin:0;font-size:16px;line-height:1.85;font-weight:400;color:#c3ced2}
.bt{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}
.bt:focus-visible,a:focus-visible{outline:2px solid #e6d6ba;outline-offset:4px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:999px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:background .45s ease,color .45s ease,border-color .45s ease,transform .45s ease}
.pill:hover{transform:translateY(-2px)}
.pill.gold{background:#d8c3a0;color:#05090c}.pill.gold:hover{background:#eef3f4;color:#05090c}
.pill.line{border:1px solid rgba(238,243,244,.3);color:#eef3f4}.pill.line:hover{border-color:#e6d6ba;color:#e6d6ba}
.navl{position:relative;text-decoration:none}
.navl::after{content:'';position:absolute;left:0;bottom:-5px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s ease}
.navl:hover::after{transform:scaleX(1);transform-origin:left}
.nav{transition:background .6s ease,border-color .6s ease,padding .6s ease,backdrop-filter .6s ease;border-bottom:1px solid transparent}
.nav.solid{background:rgba(5,9,12,.78) !important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom-color:rgba(238,243,244,.08);padding-top:16px !important;padding-bottom:16px !important}
.hero-ov.off,.hero-ov.off *{pointer-events:none !important}
.hero-ov{opacity:var(--hero,1);transform:translateY(calc((1 - var(--hero,1)) * -70px))}

@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}
@keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}
@keyframes cue{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(8px);opacity:1}}
.rise{opacity:0;animation:rise 1.2s cubic-bezier(.19,1,.22,1) forwards}
.fade{opacity:0;animation:fade 2s ease forwards}
.slidein{opacity:0;animation:slidein 1s cubic-bezier(.19,1,.22,1) forwards}
.toast{animation:toast 2.2s ease forwards}
.marquee{animation:marquee 46s linear infinite}
.marquee.rev{animation-direction:reverse;animation-duration:60s}
.glow{animation:glow 11s ease-in-out infinite}
.orb{animation:orb 12s ease-in-out infinite}
.cue{animation:cue 2.4s ease-in-out infinite}

.rv .ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.rv .ln>span{display:block;transform:translateY(112%);transition:transform 1.3s cubic-bezier(.19,1,.22,1)}
.rv.in .ln>span{transform:none}
.rv .ln+.ln>span{transition-delay:.12s}
.rv .up{opacity:0;transform:translateY(40px);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.19,1,.22,1)}
.rv.in .up{opacity:1;transform:none}
.rv .wd{opacity:.14;transition:opacity .9s ease}
.rv.in .wd{opacity:1}
.rv .rule{transform:scaleX(0);transform-origin:left;transition:transform 1.6s cubic-bezier(.19,1,.22,1)}
.rv.in .rule{transform:scaleX(1)}

.card{transition:transform .8s cubic-bezier(.19,1,.22,1),border-color .6s ease}
.card:hover{transform:translateY(-10px);border-color:rgba(216,195,160,.45) !important}
.card .word{transition:transform 1.2s cubic-bezier(.19,1,.22,1),color .6s ease}
.card:hover .word{transform:translateX(10px);color:#e6d6ba !important}
.chip{transition:background .35s ease,color .35s ease,border-color .35s ease}
.chip:hover{border-color:#e6d6ba !important}
.cta{transition:background .4s ease,color .4s ease}
.cta:hover{background:#eef3f4 !important}

.track{transform:translate3d(calc(var(--hp,0) * (100vw - 100%)),0,0);will-change:transform}
.pbar{transform:scaleX(var(--hp,0));transform-origin:left}
.prog{transform:scaleX(var(--sp,0));transform-origin:left}

@keyframes curtain{to{transform:translateY(-100%)}}
@keyframes cline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lnr{from{transform:translateY(112%)}to{transform:none}}
@keyframes beam{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes mist{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,-30px) scale(1.15)}}
@keyframes mist2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-90px,20px) scale(.95)}}
.curtain{transition:transform 1.25s cubic-bezier(.77,0,.18,1)}
.curtain.up{transform:translateY(-100%)}
.hero-ov:not(.ready) .rise,.hero-ov:not(.ready) .lnr{animation-play-state:paused}
.cl{display:inline-block;opacity:0;transform:translateY(40px);animation:rise 1s cubic-bezier(.19,1,.22,1) forwards}
.cline{transform:scaleX(0);animation:cline 1.1s cubic-bezier(.19,1,.22,1) .6s forwards}
.lnr{display:block;transform:translateY(112%);animation:lnr 1.3s cubic-bezier(.19,1,.22,1) forwards}
.beam{animation:beam 9s ease-in-out infinite}
.mist{animation:mist 17s ease-in-out infinite}
.mist2{animation:mist2 21s ease-in-out infinite}
.gw{position:absolute;font-weight:300;font-style:italic;font-size:clamp(140px,24vw,420px);line-height:1;white-space:nowrap;color:rgba(230,214,186,.05);-webkit-text-stroke:1.5px rgba(230,214,186,.42);opacity:0;transform:translateY(-6vh) scale(.92);filter:blur(6px);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.19,1,.22,1),filter 1.2s ease}
.gw.on{opacity:1;transform:translateY(-6vh) scale(1);filter:blur(0)}
.sp{pointer-events:none;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .6s ease,transform .9s cubic-bezier(.19,1,.22,1)}
.sp.on{opacity:1;transform:none}
.sp .ch{display:inline-block;opacity:0;transform:translateY(55%) rotate(7deg);transform-origin:left bottom;transition:opacity .5s ease,transform .9s cubic-bezier(.19,1,.22,1)}
.sp.on .ch{opacity:1;transform:none}
.sp.on{pointer-events:auto}
.sp .x{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .9s cubic-bezier(.19,1,.22,1)}
.sp.on .x{opacity:1;transform:none}
.sp.on .x:nth-child(2){transition-delay:.06s}.sp.on .x:nth-child(3){transition-delay:.12s}.sp.on .x:nth-child(4){transition-delay:.18s}.sp.on .x:nth-child(5){transition-delay:.24s}.sp.on .x:nth-child(6){transition-delay:.3s}
.sbar{transform:scaleX(var(--story,0));transform-origin:left}
.dot span{transition:width .5s cubic-bezier(.19,1,.22,1),background .5s ease}
.dot:hover span{background:#e6d6ba !important}
@media (max-width: 760px){
  .spw{left:16px !important;right:16px !important;top:auto !important;bottom:18px !important;transform:none !important;width:auto !important;padding:22px !important;border-radius:18px;background:rgba(8,14,18,.7);backdrop-filter:blur(14px)}
  .gw{font-size:42vw}
}
@media (prefers-reduced-motion: reduce){
  .curtain{display:none}
  .cl,.cline,.lnr,.beam,.mist,.mist2{animation:none !important;opacity:1 !important;transform:none !important}
  .gw,.sp .x{transition:none !important}
}
.cur{transform:translate3d(var(--cx,-200px),var(--cy,-200px),0) scale(var(--cs,1));transition:transform .28s cubic-bezier(.19,1,.22,1),opacity .3s ease;opacity:var(--co,0)}
.curd{transform:translate3d(var(--cx,-200px),var(--cy,-200px),0);opacity:var(--co,0)}
.curt{opacity:var(--cd,0);transition:opacity .3s ease}
.skew{transform:skewX(calc(var(--skew,0) * 1deg));transition:transform .25s ease-out}
@media (hover: none), (pointer: coarse){ .cur,.curd{display:none} }
@media (max-width: 760px){
  .panel{left:16px !important;right:16px !important;top:auto !important;bottom:16px !important;transform:none !important;width:auto !important}
  .hidem{display:none !important}
  .pin{height:auto !important}
  .pin-sticky{position:relative !important;height:auto !important;padding:96px 0 !important}
  .track{transform:none !important;width:100% !important;overflow-x:auto;scroll-snap-type:x mandatory}
  .track>*{scroll-snap-align:start}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .rise,.fade,.slidein,.marquee,.glow,.orb,.cue{animation:none !important;opacity:1 !important}
  .rv .ln>span,.rv .up,.rv .wd,.rv .rule{transition:none !important;opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div ref="{{setRoot}}" onPointerMove="{{rootMove}}" style="width: 100%; background: #05090c; color: #eef3f4; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-weight: 300; overflow-x: clip">

  <div aria-hidden="true" class="cur" style="position: fixed; z-index: 120; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 1px solid rgba(230,214,186,.85); pointer-events: none; display: flex; align-items: center; justify-content: center">
    <span class="curt" style="font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #e6d6ba">Kéo</span>
  </div>
  <div aria-hidden="true" class="curd" style="position: fixed; z-index: 121; left: 0; top: 0; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #e6d6ba; pointer-events: none"></div>
  <div aria-hidden="true" class="prog" style="position: fixed; z-index: 60; top: 0; left: 0; right: 0; height: 2px; background: #d8c3a0"></div>

  <!-- NAV -->
  <header class="{{navClass}}" style="position: fixed; z-index: 50; top: 0; left: 0; right: 0; padding: 24px clamp(20px, 5vw, 64px); font-weight: 400; background: linear-gradient(180deg, rgba(5,9,12,.7), rgba(5,9,12,0)); display: flex; align-items: center; justify-content: space-between; gap: 20px">
    <a href="#top" class="serif" style="font-size: 26px; letter-spacing: 0.34em; text-decoration: none; font-weight: 400">ALPS</a>
    <nav aria-label="Chính" class="hidem" style="display: flex; gap: 36px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase">
      <a class="navl" href="#top">Trang chủ</a>
      <a class="navl" href="#alps-p0">Danh mục</a>
      <a class="navl" href="#story">Về ALPS</a>
      <a class="navl" href="#contact">Liên hệ</a>
    </nav>
    <span style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase">Giỏ hàng ({{cart}})</span>
  </header>

  <!-- INTRO CURTAIN -->
  <div aria-hidden="true" class="curtain {{curtainCls}}" style="position: fixed; z-index: 100; inset: 0; background: #05090c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; pointer-events: none">
    <span class="serif" style="display: flex; font-size: clamp(64px, 11vw, 160px); font-weight: 300; letter-spacing: 0.32em; padding-left: 0.32em; color: #eef3f4">
      <span class="cl" style="animation-delay: .15s">A</span><span class="cl" style="animation-delay: .27s">L</span><span class="cl" style="animation-delay: .39s">P</span><span class="cl" style="animation-delay: .51s">S</span>
    </span>
    <span class="cline" style="display: block; width: 160px; height: 1px; background: #d8c3a0"></span>
    <span class="cl" style="font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase; color: #d8c3a0; animation-delay: .8s">Pure Essence · Switzerland</span>
    <span class="cl serif" style="position: absolute; right: clamp(20px, 5vw, 64px); bottom: 36px; font-size: clamp(48px, 6vw, 92px); font-weight: 300; font-style: italic; color: rgba(238,243,244,.85); animation-delay: .3s">{{pct}}<span style="font-size: .4em; vertical-align: top; margin-left: 4px">%</span></span>
    <span style="position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: rgba(238,243,244,.08)"><span style="{{pctBar}}"></span></span>
  </div>

  <!-- 3D STORY STAGE -->
  <section id="top" ref="{{setStage}}" style="position: relative; height: 700vh">
    <div aria-hidden="true" id="alps-a0" style="position: absolute; top: 0; height: 1px; width: 1px"></div>
    <div aria-hidden="true" id="alps-p0" style="position: absolute; top: 115vh; height: 1px; width: 1px"></div>
    <div aria-hidden="true" id="alps-p1" style="position: absolute; top: 215vh; height: 1px; width: 1px"></div>
    <div aria-hidden="true" id="alps-p2" style="position: absolute; top: 315vh; height: 1px; width: 1px"></div>
    <div aria-hidden="true" id="alps-p3" style="position: absolute; top: 415vh; height: 1px; width: 1px"></div>
    <div aria-hidden="true" id="alps-p4" style="position: absolute; top: 515vh; height: 1px; width: 1px"></div>

    <div style="position: sticky; top: 0; height: 100vh; min-height: 620px; overflow: hidden; background: #05090c">
      <!-- atmosphere -->
      <div aria-hidden="true" class="beam" style="position: absolute; top: -30%; left: 50%; width: 1100px; height: 1100px; margin-left: -550px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(150,190,206,.30), rgba(150,190,206,0) 60%); pointer-events: none"></div>
      <div aria-hidden="true" class="mist" style="position: absolute; bottom: 8%; left: 8%; width: 620px; height: 260px; border-radius: 50%; background: rgba(150,190,206,.10); filter: blur(70px); pointer-events: none"></div>
      <div aria-hidden="true" class="mist2" style="position: absolute; bottom: 18%; right: 6%; width: 520px; height: 240px; border-radius: 50%; background: rgba(216,195,160,.07); filter: blur(80px); pointer-events: none"></div>

      <!-- giant words behind the 3D -->
      <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
        <sc-for list="{{words}}" as="w" hint-placeholder-count="6">
          <span class="gw serif {{w.cls}}">{{w.text}}</span>
        </sc-for>
      </div>

      <canvas ref="{{setCanvas}}" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerLeave="{{leave}}" aria-label="Bộ sưu tập ALPS dạng 3D — cuộn để đi qua từng sản phẩm, kéo để xoay" role="img" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y"></canvas>

      <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
        <p role="status" style="position: absolute; z-index: 4; left: 50%; bottom: 110px; transform: translateX(-50%); margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #bccacf">Đang tải mô hình 3D…</p>
      </sc-if>
      <sc-if value="{{nogl}}" hint-placeholder-val="{{ false }}">
        <p style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); margin: 0; font-size: 14px; color: #bccacf">Trình duyệt này không hỗ trợ WebGL để hiển thị 3D.</p>
      </sc-if>

      <!-- hero copy -->
      <div class="hero-ov {{heroCls}} {{heroReady}}" style="position: absolute; z-index: 4; inset: 0; pointer-events: none">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(5,9,12,.82) 0%, rgba(5,9,12,.55) 34%, rgba(5,9,12,0) 62%), linear-gradient(0deg, rgba(5,9,12,.75) 0%, rgba(5,9,12,0) 26%)"></div>
        <div class="wrap" style="position: relative; padding-top: 130px">
          <p class="eb rise" style="position: relative; animation-delay: .35s; font-weight: 500; color: #e6d6ba">Dược mỹ phẩm tế bào gốc sông băng Thụy Sĩ</p>
          <h1 class="serif" style="position: relative; margin: 0; max-width: 700px; font-weight: 400; font-size: clamp(42px, 5.2vw, 84px); line-height: 1; letter-spacing: -0.01em; color: #ffffff; text-shadow: 0 2px 30px rgba(0,0,0,.55)">
            <span class="ln"><span class="lnr" style="animation-delay: .45s">Sự thuần khiết tột cùng,</span></span>
            <span class="ln"><span class="lnr" style="font-style: italic; color: #e6d6ba; animation-delay: .6s">đánh thức làn da tỏa sáng.</span></span>
          </h1>
          <p class="rise hidem" style="position: relative; margin: 24px 0 0; max-width: 420px; font-size: 16px; line-height: 1.75; font-weight: 400; color: #d6e0e3; animation-delay: .85s">Chắt lọc từ nguồn nước khoáng sông băng Matterhorn cổ đại và thảo mộc tuyết Alps.</p>
        </div>
        <div class="rise" style="position: absolute; z-index: 1; left: 0; right: 0; bottom: 30px; animation-delay: 1.1s">
          <div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px">
            <div style="display: flex; flex-wrap: wrap; gap: 10px; pointer-events: auto">
              <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
                <button type="button" class="bt chip" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(238,243,244,.32); background: rgba(5,9,12,.62); backdrop-filter: blur(10px); font-size: 13px; font-weight: 400; color: #ffffff">{{c.name}}</button>
              </sc-for>
            </div>
            <span class="hidem" style="display: inline-flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400; color: #d6e0e3">Cuộn để khám phá
              <svg class="cue" aria-hidden="true" width="12" height="16" viewBox="0 0 12 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 1v13M1 9l5 5 5-5"></path></svg>
            </span>
          </div>
        </div>
      </div>

      <!-- product story panels -->
      <sc-for list="{{story}}" as="s" hint-placeholder-count="5">
        <div class="spw" style="{{s.wrap}}">
          <div class="sp {{s.cls}}" style="display: flex; flex-direction: column; gap: 16px; padding: clamp(24px, 2.6vw, 38px); border-radius: 24px; background: rgba(6,11,14,.66); border: 1px solid rgba(238,243,244,.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0,0,0,.45)">
            <p class="x" style="margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: #d8c3a0"><span class="serif" style="font-size: 22px; letter-spacing: 0.04em; font-style: italic">{{s.num}}</span><span style="width: 28px; height: 1px; background: #d8c3a0"></span>{{s.cat}}</p>
            <h2 class="serif" aria-label="{{s.name}}" style="margin: 0; font-weight: 400; font-size: clamp(38px, 3.8vw, 58px); line-height: 1.02; color: #ffffff"><sc-for list="{{s.words}}" as="wd" hint-placeholder-count="3"><span aria-hidden="true" style="display: inline-block; white-space: nowrap; margin-right: .22em"><sc-for list="{{wd.chars}}" as="ch" hint-placeholder-count="6"><span class="ch" style="{{ch.st}}">{{ch.c}}</span></sc-for></span></sc-for></h2>
            <p class="x" style="margin: 0; font-size: 15px; line-height: 1.8; font-weight: 400; color: #d6e0e3">{{s.desc}}</p>
            <div class="x" style="display: flex; align-items: baseline; gap: 14px; padding-top: 6px">
              <span class="serif" style="font-size: 34px; color: #e6d6ba">{{s.price}}</span>
              <s style="font-size: 14px; color: #8a9ba3">{{s.old}}</s>
              <span style="padding: 4px 10px; border-radius: 999px; background: #d8c3a0; color: #05090c; font-size: 11px; font-weight: 500">−20%</span>
            </div>
            <p class="x" style="margin: 0; font-size: 12px; letter-spacing: 0.14em; font-weight: 400; color: #c6d2d6">{{s.size}}</p>
            <div class="x" style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 6px">
              <button type="button" class="bt pill gold" onClick="{{s.add}}">Thêm vào giỏ</button>
              <a class="pill line" href="https://alps.id.vn/san-pham">Mua ngay</a>
            </div>
          </div>
        </div>

  pickAt(x, y) {
    const cv = this.canvas; const Wc = cv.clientWidth, Hc = cv.clientHeight;
    const ro = this.cam.ro, ta = this.cam.ta;
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const nz = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };

    const up = [rt[1] * fw[2] - rt[2] * fw[1], rt[2] * fw[0] - rt[0] * fw[2], rt[0] * fw[1] - rt[1] * fw[0]];
    let best = -1, bestZ = 1e9;

      const a = this.slotAngle(i);
